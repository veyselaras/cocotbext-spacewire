[project]
name = "cocotbext-spacewire"
version = "0.1.0.dev0"
description = "SpaceWire VIP for cocotb"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "hypothesis>=6.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cocotbext"]
